<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reading Admin</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f2027;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
padding:20px;
}

.back{
position:absolute;
top:15px;
left:15px;
padding:10px 20px;
background:#ffffff22;
color:white;
text-decoration:none;
border-radius:10px;
}

.box{
width:750px;
background:#203a43;
padding:20px;
border-radius:15px;
}

h2{text-align:center;}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

textarea{
min-height:150px;
}

/* Arabic text - right to left */
textarea[dir="rtl"], 
textarea:lang(ar),
textarea:dir(rtl) {
direction: rtl;
text-align: right;
}

/* Default - left to right for non-Arabic */
textarea[dir="ltr"],
textarea:not(:lang(ar)):not([dir="rtl"]) {
direction: ltr;
text-align: left;
}

/* RTL for displayed Arabic text in list */
.rtl-text {
direction: rtl;
text-align: right;
}

.question{
background:#2c5364;
padding:10px;
margin-top:10px;
border-radius:10px;
}

button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.save{
background:white;
color:black;
font-weight:bold;
}

.item{
background:#1b2d36;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.actions{
display:flex;
gap:10px;
}

.actions button{
flex:1;
}

.activate{background:limegreen;color:white;}
.delete{background:red;color:white;}

@media(max-width:800px){
.box{width:100%;}
.actions{flex-direction:column;}
}
</style>
<base target="_blank">
<base target="_blank">
<base target="_blank">
</head>

<body>

<!-- 🔙 BACK BUTTON (SAVOLLARGA QAYTADI) -->

<div class="box">

<h2>📘 Reading Admin</h2>

<select id="section">
<option value="easy">Oson</option>
<option value="medium">O‘rtacha</option>
<option value="hard">Qiyin</option>
</select>

<textarea id="text" placeholder="Matn kiriting" oninput="checkDirection(this)"></textarea>

<div id="questions"></div>

<button class="save" onclick="addReading()">
Saqlash
</button>

<div id="list"></div>

</div>

<script>
// Check if text contains Arabic characters and set direction
function checkDirection(textarea) {
    var text = textarea.value;
    // Arabic Unicode range: ؀-ۿ, ݐ-ݿ, ࢠ-ࣿ, ﭐ-﷿, ﹰ-﻿
    var hasArabic = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(text);
    if (hasArabic) {
        textarea.setAttribute('dir', 'rtl');
    } else {
        textarea.setAttribute('dir', 'ltr');
    }
}

// Check if text is Arabic for display
function isArabic(text) {
    return /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(text);
}

// Auto direction for any input/textarea
function autoDir(el) {
    var text = el.value;
    var hasArabic = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(text);
    if (hasArabic) {
        el.style.direction = 'rtl';
        el.style.textAlign = 'right';
    } else {
        el.style.direction = 'ltr';
        el.style.textAlign = 'left';
    }
}

// Apply auto direction to all inputs and textareas
function applyAutoDir() {
    var inputs = document.querySelectorAll('input[type="text"], textarea');
    inputs.forEach(function(el) {
        if (!el.getAttribute('data-autodir')) {
            el.setAttribute('data-autodir', 'true');
            el.addEventListener('input', function() { autoDir(el); });
            autoDir(el);
        }
    });
}

// Run on load and after dynamic elements added
window.addEventListener('load', applyAutoDir);
setInterval(applyAutoDir, 500);
</script>

<script src="reading-admin.js"></script>

</body>
</html>
